<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>涨潮镇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --deep: #24384f; --shallow: #4a7ba6; --sand: #e8d6b2;
    --land1: #ced8a8; --land2: #a4c28a; --land3: #7ca674; --rock: #96968c;
  }
  body {
    min-height: 100vh; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 120%, #2b4763 0%, #1b2a3d 60%, #121c29 100%);
    color: #eef2f5; display: flex; align-items: center; justify-content: center; padding: 24px;
    overflow-x: hidden;
  }
  .wave { position: fixed; left: 0; right: 0; bottom: 0; height: 160px; opacity: .35; pointer-events: none; }
  .wave svg { width: 200%; height: 100%; animation: drift 18s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .app { position: relative; width: 100%; max-width: 1080px; display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  .island-card {
    background: rgba(20, 32, 46, .72); border: 1px solid rgba(160, 200, 235, .18);
    border-radius: 22px; padding: 22px; backdrop-filter: blur(8px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
  }
  h1 { font-size: 30px; letter-spacing: 2px; font-weight: 600; }
  .cover { width: 100%; border-radius: 16px; margin-bottom: 18px; display: block; opacity: .96; }
  .hero h1 { font-size: 44px; letter-spacing: 6px; line-height: 1.1;
    background: linear-gradient(100deg, #f4efe6 10%, #9fe0c8 55%, #6cc4d9 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { font-size: 13.5px; color: #a8bfd0; margin-top: 10px; letter-spacing: .5px; }
  .sub { color: #9fb6c9; font-size: 13px; margin: 18px 0; }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .cell {
    position: relative; aspect-ratio: 1; border-radius: 14px; cursor: pointer;
    transition: transform .15s, box-shadow .15s; display: flex; align-items: center;
    justify-content: center; font-size: 13px; text-align: center; padding: 6px;
    color: #23303c; border: 2px solid transparent;
  }
  .cell:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.3); }
  .cell.water { color: rgba(220, 235, 250, .45); cursor: not-allowed; background: linear-gradient(160deg, #33597f, #24425f); }
  .cell.water::after {
    content: ""; position: absolute; inset: 0; border-radius: 12px;
    background: repeating-linear-gradient(0deg, transparent 0 12px, rgba(180, 215, 245, .12) 12px 13px);
  }
  .cell.water:hover { transform: none; box-shadow: none; }
  .h0 { background: var(--sand); } .h1 { background: var(--land1); }
  .h2 { background: var(--land2); } .h3 { background: var(--land3); } .h4 { background: var(--rock); }
  .cell.risky { border-color: #e2b25a; box-shadow: 0 0 0 3px rgba(226, 178, 90, .25); }
  .bld { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .bld small { display: block; font-weight: 400; font-size: 10px; opacity: .75; margin-top: 3px; }

  .panel { display: flex; flex-direction: column; gap: 16px; }
  .box { background: rgba(20, 32, 46, .72); border: 1px solid rgba(160, 200, 235, .18); border-radius: 18px; padding: 16px 18px; backdrop-filter: blur(8px); }
  .box h2 { font-size: 13px; font-weight: 600; color: #8fb0c8; letter-spacing: 1px; margin-bottom: 10px; }
  .stat { display: flex; gap: 16px; font-size: 14px; }
  .stat b { color: #9fe0c8; }
  input, textarea {
    width: 100%; padding: 9px 11px; margin-top: 8px; border-radius: 10px;
    border: 1px solid rgba(160, 200, 235, .25); background: rgba(10, 18, 28, .55);
    color: #eef2f5; font-size: 13px; font-family: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: #6aa9d8; }
  button {
    width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit; color: #12202c;
    background: linear-gradient(120deg, #9fe0c8, #6cc4d9); transition: filter .15s;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: #b8cdd9; border: 1px solid rgba(160,200,235,.3); }
  .row { display: flex; gap: 8px; }
  .log { height: 130px; overflow-y: auto; font-size: 12.5px; line-height: 1.8; color: #b9cfdd; }
  .log div { border-bottom: 1px dashed rgba(160, 200, 235, .12); padding: 2px 0; }
  .people { font-size: 13px; line-height: 2; color: #b9cfdd; }
  .people span { color: #9fe0c8; }
  .hint { font-size: 11.5px; color: #7f97a8; margin-top: 8px; line-height: 1.6; }
</style>
</head>

    <path d="M0,110 C180,140 360,80 540,110 C720,140 900,80 1080,110 C1140,120 1180,105 1200,110 L1200,160 L0,160 Z" fill="#2b4763" opacity=".8"/>
  </svg>
</div>

      <h1>涨潮镇</h1>
      <p class="tagline">一座会被水淹的小岛。盖吧，趁潮还没来。</p>
    </div>
    <div class="sub" id="sub">水位 1 · 第 0 回合</div>
    <div class="grid" id="grid"></div>
    <div class="hint">点陆地格盖东西。低处便宜好看，但下一潮就可能没了。黄色框的是下一潮会淹掉的。别人盖的，你可以点开看看留言。</div>
  </div>

  <div class="panel">
    <div class="box">
      <h2>你</h2>
      <input id="name" placeholder="你的名字" value="">
      <div class="stat" style="margin-top:10px"><span>材料 <b id="mats">1</b></span><span>盖过 <b id="built">0</b></span></div>
      <button id="ebb">等退潮（捡 2 个材料）</button>
      <button id="tide" class="ghost">让潮水涨一格</button>
    </div>
    <div class="box">
      <h2>盖的时候</h2>
      <input id="bname" placeholder="盖什么（灯塔/小屋/菜地…）">
      <input id="msg" placeholder="留一句话给后来的人">
    </div>
    <div class="box">
      <h2>岛上的话</h2>
      <div class="log" id="log"></div>
    </div>
    <div class="box">
      <h2>来过的人</h2>
      <div class="people" id="people"><em style="color:#7f97a8">还没有人</em></div>
      <div class="row">
        <button class="ghost" id="export">把岛传给下一只鱼</button>
      </div>
      <div class="row">
        <button class="ghost" id="importBtn">接一张岛</button>
        <button class="ghost" id="download">下载岛（world.json）</button>
      </div>
      <input id="importBox" placeholder="把别人给你的岛（一串字）粘这" style="display:none">
      <button id="importGo" class="ghost" style="display:none">接过来</button>
    </div>
  </div>
</div>

<script>
const HEIGHTS = [
  [0,1,1,0,0],
  [1,2,3,2,1],
  [1,3,4,3,1],
  [1,2,3,2,1],
  [0,1,1,1,0],
];
const SIZE = 5;
const KEY = 'chaoxizhen.v1';

const seed = {
  water: 1, tick: 0, players: {}, buildings: [], notes: []
};

let world;
function load() {
  try { world = JSON.parse(localStorage.getItem(KEY)) || structuredClone(seed); }
  catch (e) { world = structuredClone(seed); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(world)); }
function me() { return document.getElementById('name').value.trim() || ''; }
function ensurePlayer() {
  const n = me();
  if (!n) return null;
  if (!world.players[n]) world.players[n] = { mats: 1, built: 0 };
  return world.players[n];
}
function aliveAt(x, y) { return world.buildings.find(b => b.x === x && b.y === y && b.alive); }

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const subs = document.getElementById('sub');
  const aliveCount = world.buildings.filter(b => b.alive).length;
  subs.textContent = `水位 ${world.water} · 第 ${world.tick} 回合 · 岛上 ${aliveCount} 件东西`;

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const h = HEIGHTS[y][x];
      const d = document.createElement('div');
      d.className = 'cell';
      if (h < world.water) {
        d.classList.add('water');
        const dead = world.buildings.find(b => b.x === x && b.y === y && !b.alive);
        if (dead) {
          d.textContent = dead.name;
          d.style.color = 'rgba(205, 225, 245, .5)';
          d.title = `沉在水底：${dead.owner} 的${dead.name}${dead.msg ? '——' + dead.msg : ''}`;
        } else {
          d.textContent = '~';
        }
      } else {
        d.classList.add('h' + h);
        const b = aliveAt(x, y);
        if (b) {
          d.innerHTML = `<span class="bld">${b.name}<small>${b.owner}</small></span>`;
          d.title = `${b.owner}：${b.msg || '（没留话）'}`;
        } else {
          d.textContent = h >= 3 ? '石' : '';
        }
        if (h < world.water + 1) d.classList.add('risky');
        d.onclick = () => build(x, y, h);
      }
      grid.appendChild(d);
    }
  }
  updatePanel();
}

function updatePanel() {
  const p = world.players[me()];
  document.getElementById('mats').textContent = p ? p.mats : 1;
  document.getElementById('built').textContent = p ? p.built : 0;

  const log = document.getElementById('log');
  log.innerHTML = world.notes.slice(-12).map(n =>
    `<div>(${n.x},${n.y}) <b>${n.who}</b>：${n.text}</div>`).join('') || '<div>还没有人留下话</div>';

  const people = document.getElementById('people');
  const names = Object.keys(world.players);
  people.innerHTML = names.length
    ? names.map(n => `<div><span>${n}</span>　盖过 ${world.players[n].built} 件，手上 ${world.players[n].mats} 个材料</div>`).join('')
    : '<em style="color:#7f97a8">还没有人</em>';
}

function say(text) {
  const log = document.getElementById('log');
  const d = document.createElement('div');
  d.textContent = text;
  log.prepend(d);
}

function build(x, y, h) {
  const p = ensurePlayer();
  if (!p) return say('先在上面填个名字。');
  if (h < world.water) return;
  const existing = aliveAt(x, y);
  if (existing) return say(`${existing.owner} 的${existing.name}在这儿，你别拆。`);
  if (p.mats <= 0) return say('没材料了，等退潮。');
  const name = document.getElementById('bname').value.trim() || '小屋';
  const msg = document.getElementById('msg').value.trim();
  p.mats--; p.built++;
  world.buildings.push({ x, y, name, owner: me(), msg, alive: true });
  say(`盖好了：${name}（${x},${y}，海拔 ${h}）`);
  save(); render();
}

function tide() {
  world.tick++; world.water++;
  const lost = world.buildings.filter(b => b.alive && HEIGHTS[b.y][b.x] < world.water);
  lost.forEach(b => { b.alive = false; b.drownedTick = world.tick; b.drownedWater = world.water; });
  world.history = world.history || [];
  world.history.push({
    tick: world.tick, water: world.water,
    lost: lost.map(b => `${b.name}(${b.owner})`),
    alive: world.buildings.filter(b => b.alive).length,
  });
  say(`潮来了，水位 ${world.water}。` + (lost.length ? `冲走了：${lost.map(b => b.name).join('、')}，沉在水底记着。` : '什么也没淹着。'));
  save(); render();
}

function ebb() {
  if (world.water <= 0) return say('水已经退到底了。');
  world.water--;
  Object.keys(world.players).forEach(n => world.players[n].mats += 2);
  say(`退潮，水位 ${world.water}。每人捡到 2 个材料。`);
  save(); render();
}

document.getElementById('tide').onclick = tide;
document.getElementById('ebb').onclick = ebb;
document.getElementById('name').oninput = () => { ensurePlayer(); save(); updatePanel(); };

document.getElementById('export').onclick = async () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(world))));
  try { await navigator.clipboard.writeText(code); say('岛复制好了，发给他就行。'); }
  catch (e) { prompt('复制这串给下一只鱼：', code); }
};
document.getElementById('download').onclick = () => {
  const blob = new Blob([JSON.stringify(world, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'world.json';
  a.click();
  say('岛下载好了，命令行那边 import 就能接着玩。');
};
document.getElementById('importBtn').onclick = () => {
  const box = document.getElementById('importBox'), go = document.getElementById('importGo');
  box.style.display = go.style.display = 'block';
};
document.getElementById('importGo').onclick = () => {
  try {
    const code = document.getElementById('importBox').value.trim();
    world = JSON.parse(decodeURIComponent(escape(atob(code))));
    save(); render(); say('岛接过来了。');
  } catch (e) { say('这串读不出来，再核对一下。'); }
};

load();
render();
</script>
</body>
</html>
